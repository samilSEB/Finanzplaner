<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanzplaner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0f766e">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#111; --muted:#666; --plus:#15803d; --minus:#b91c1c; --accent:#0f766e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --card:#1c1c1e; --fg:#eee; --muted:#999; --plus:#4ade80; --minus:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:600px; margin:auto; padding:16px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:16px; }
  form { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  input, select, button { font:inherit; padding:10px; border-radius:8px; border:1px solid #8884; background:var(--bg); color:var(--fg); width:100%; }
  button { background:var(--accent); color:#fff; border:0; }
  .full { grid-column:1 / -1; }
  .sum { display:flex; justify-content:space-between; text-align:center; }
  .sum b { display:block; font-size:1.2em; }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid #8882; }
  li .t { flex:1; } li small { color:var(--muted); display:block; }
  li .del { width:auto; background:none; color:var(--muted); padding:4px 8px; }
  .plus { color:var(--plus); } .minus { color:var(--minus); }
  .row { display:flex; gap:8px; }
</style>
</head>
<body>
<main>
  <h1>Finanzplaner</h1>

  <div class="card">
    <form id="f">
      <select name="type" aria-label="Art"><option value="-1">Ausgabe</option><option value="1">Einnahme</option></select>
      <input name="amount" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="Betrag €" required aria-label="Betrag">
      <input name="cat" list="cats" placeholder="Kategorie" required aria-label="Kategorie">
      <input name="date" type="date" required aria-label="Datum">
      <input name="note" class="full" placeholder="Notiz (optional)" aria-label="Notiz">
      <button class="full">Hinzufügen</button>
    </form>
    <datalist id="cats"></datalist>
  </div>

  <div class="card">
    <input id="month" type="month" aria-label="Monat">
    <div class="sum" style="margin-top:12px">
      <div>Einnahmen<b id="in" class="plus"></b></div>
      <div>Ausgaben<b id="out" class="minus"></b></div>
      <div>Saldo<b id="bal"></b></div>
    </div>
    <ul id="bycat" style="margin-top:12px"></ul>
  </div>

  <div class="card"><ul id="list"></ul></div>

  <div class="card row">
    <button id="exp">Backup exportieren</button>
    <button id="imp">Backup importieren</button>
    <input id="file" type="file" accept=".json" hidden>
  </div>
</main>
<script>
// ponytail: localStorage (~5MB, reicht für zehntausende Einträge); Daten liegen nur auf diesem Gerät -> Backup-Export nutzen
const KEY = 'finanzen';
let items = JSON.parse(localStorage.getItem(KEY) || '[]');
const save = () => localStorage.setItem(KEY, JSON.stringify(items));
const eur = n => n.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
const $ = id => document.getElementById(id);
const today = new Date().toLocaleDateString('sv'); // lokales YYYY-MM-DD, nicht UTC
const DEFAULT_CATS = ['Lebensmittel', 'Miete', 'Transport', 'Restaurant', 'Freizeit', 'Kleidung', 'Gesundheit', 'Abos', 'Versicherung', 'Gehalt', 'Sonstiges'];
const f = $('f');
f.date.value = today;
$('month').value = today.slice(0, 7);

function render() {
  const m = $('month').value;
  const mi = items.filter(i => i.date.startsWith(m)).sort((a, b) => b.date.localeCompare(a.date));
  const inc = mi.filter(i => i.amount > 0).reduce((s, i) => s + i.amount, 0);
  const out = mi.filter(i => i.amount < 0).reduce((s, i) => s - i.amount, 0);
  $('in').textContent = eur(inc); $('out').textContent = eur(out);
  $('bal').textContent = eur(inc - out); $('bal').className = inc >= out ? 'plus' : 'minus';

  const cats = {};
  mi.filter(i => i.amount < 0).forEach(i => cats[i.cat] = (cats[i.cat] || 0) - i.amount);
  $('bycat').innerHTML = '';
  Object.entries(cats).sort((a, b) => b[1] - a[1]).forEach(([c, v]) => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="t"></span><span class="minus"></span>';
    li.children[0].textContent = c; li.children[1].textContent = eur(v);
    $('bycat').append(li);
  });

  $('list').innerHTML = '';
  mi.forEach(i => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="t"><span></span><small></small></span><span></span><button class="del" aria-label="Löschen">✕</button>';
    li.querySelector('.t span').textContent = i.cat;
    li.querySelector('small').textContent = new Date(i.date).toLocaleDateString('de-DE') + (i.note ? ' · ' + i.note : '');
    const amt = li.children[1]; amt.textContent = eur(i.amount); amt.className = i.amount > 0 ? 'plus' : 'minus';
    li.querySelector('.del').onclick = () => { if (confirm('Eintrag löschen?')) { items = items.filter(x => x !== i); save(); render(); } };
    $('list').append(li);
  });
  if (!mi.length) $('list').innerHTML = '<li>Keine Einträge in diesem Monat</li>';

  $('cats').innerHTML = '';
  [...new Set([...DEFAULT_CATS, ...items.map(i => i.cat)])].forEach(c => { const o = document.createElement('option'); o.value = c; $('cats').append(o); });
}

f.onsubmit = e => {
  e.preventDefault();
  items.push({ id: Date.now(), date: f.date.value, amount: f.type.value * f.amount.value, cat: f.cat.value.trim(), note: f.note.value.trim() });
  save(); f.amount.value = f.note.value = ''; $('month').value = f.date.value.slice(0, 7); render();
};
$('month').onchange = render;

$('exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(items, null, 1)], { type: 'application/json' }));
  a.download = `finanzen-${today}.json`; a.click();
};
$('imp').onclick = () => $('file').click();
$('file').onchange = async e => {
  try {
    const data = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(data) || !data.every(i => i.date && typeof i.amount === 'number' && i.cat)) throw 0;
    if (confirm(`${data.length} Einträge importieren? Aktuelle Daten werden ersetzt.`)) { items = data; save(); render(); }
  } catch { alert('Ungültige Backup-Datei'); }
  e.target.value = '';
};

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
navigator.storage?.persist?.();
</script>
</body>
</html>
